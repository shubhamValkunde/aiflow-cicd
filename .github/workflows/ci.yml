name: AIFlow CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Version
        run: python --version

      - name: Ruff Lint
        run: ruff check .

      - name: Run Unit Tests
        run: pytest

      - name: Build Docker Image
        run: |
          docker build -t aiflow-cicd:${{ github.sha }} -t aiflow-cicd:latest .

      - name: Verify Docker Image
        run: docker images

      # 🧠 NEW: Full AI stack test using Docker Compose
      - name: Start Full AI Stack (Compose)
        run: |
          docker compose up -d --build

      - name: Wait for Services
        run: |
          sleep 20

      # API Health Check
      - name: Test API Health
        run: |
          curl http://localhost:8000

      # Redis Check (basic connectivity)
      - name: Test Redis Connection
        run: |
          docker exec $(docker ps -q --filter "name=redis") redis-cli ping

      # Postgres Check
      - name: Test Postgres Connection
        run: |
          docker exec $(docker ps -q --filter "name=postgres") pg_isready

      # Qdrant Check
      - name: Test Qdrant Health
        run: |
          curl http://localhost:6333/health

      - name: Stop All Services
        if: always()
        run: |
          docker compose down