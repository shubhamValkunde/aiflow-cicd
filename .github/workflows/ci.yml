name: AIFlow CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Version
        run: python --version

      - name: Ruff Lint
        run: ruff check .

      - name: Run Unit Tests
        run: pytest

      - name: Build Docker Image
        run: |
          docker build -t aiflow-cicd:${{ github.sha }} -t aiflow-cicd:latest .

      - name: Verify Docker Image
        run: docker images

      - name: Start Full AI Stack (Compose)
        run: |
          docker compose up -d --build

      - name: Wait for API to be ready
        run: |
          for i in {1..15}; do
            curl --fail http://localhost:8000 && exit 0
            echo "Waiting for API..."
            sleep 3
          done
          exit 1

      - name: Test API Health
        run: |
          curl --fail http://localhost:8000

      - name: Test Chat Endpoint
        run: |
          curl --fail -X POST "http://localhost:8000/chat" \
            -H "Content-Type: application/json" \
            -d '{"message":"hello"}'

      - name: Test Redis Connection
        run: |
          docker exec aiflow-redis redis-cli ping

      - name: Test Postgres Connection
        run: |
          docker exec aiflow-postgres pg_isready

      - name: Test Qdrant Health
        run: |
          curl --fail http://localhost:6333/

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop All Services
        if: always()
        run: |
          docker compose down