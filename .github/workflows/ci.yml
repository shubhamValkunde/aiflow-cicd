name: AIFlow CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Version
        run: python --version

      - name: Ruff Lint
        run: ruff check .

      - name: Run Unit Tests
        run: pytest

      - name: Build Docker Image
        run: |
          docker build -t aiflow-cicd:${{ github.sha }} -t aiflow-cicd:latest .

      - name: Verify Docker Image
        run: |
          docker images

      - name: Run Docker Container
        run: |
          docker run -d --name aiflow-container -p 8000:8000 aiflow-cicd:latest

      - name: Wait for Application
        run: |
          sleep 10

      - name: Test Container Health
        run: |
          curl http://localhost:8000

      - name: Stop Container
        if: always()
        run: |
          docker stop aiflow-container
          docker rm aiflow-container