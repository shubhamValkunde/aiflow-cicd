name: AIFlow CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Version
        run: python --version

      - name: Ruff Lint
        run: ruff check .

      - name: Debug Environment
        run: |
          python --version
          pip list
          python -c "import fastapi, starlette, httpx; print('FastAPI:', fastapi.__version__); print('Starlette:', starlette.__version__); print('httpx:', httpx.__version__)"
          python -c "import inspect, starlette.testclient; print(inspect.getsource(starlette.testclient)[:1500])"

      - name: Run Unit Tests
        run: pytest