version: "3.9"

services:

  api:
    build: .
    container_name: aiflow-api
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
      - qdrant
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aiflow
      - QDRANT_URL=http://qdrant:6333

  redis:
    image: redis:7
    container_name: aiflow-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    container_name: aiflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: aiflow-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: aiflow-webui
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  pgdata:
  qdrant_data: